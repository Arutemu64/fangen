# Keep dependencies and pinned tool versions fresh.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # pre-commit hook `rev` pins (natively supported by Dependabot since 2026).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns:
          - "*"

  # Python dependencies managed via uv (reads pyproject.toml / uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"

  # GitHub Actions used in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
