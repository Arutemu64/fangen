name: Lint

# Run all pre-commit hooks (ruff, ty, taplo, JSON/TOML/YAML checks, ...) on
# every push and pull request so nothing unformatted or invalid lands on the
# default branch. Mirrors what `uv run pre-commit run --all-files` does locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
