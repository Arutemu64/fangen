# See https://pre-commit.com for more information.
#
# Run `uv run pre-commit install` once to enable the git hook; hooks then run
# automatically on `git commit`. Run against everything with
# `uv run pre-commit run --all-files`.
#
# The Python hooks (ruff, ty) are `local` hooks that invoke the tools through
# `uv run`, so the exact versions pinned in `uv.lock` are used (single source
# of truth, no drift between the hook and the project environment). This
# mirrors how the `justfile` runs the same tools.
repos:
  # Generic file hygiene + JSON/YAML syntax checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        # VS Code's own JSON files (settings.json, extensions.json) are
        # JSONC and allow comments, which plain JSON parsing rejects.
        exclude: ^\.vscode/
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  # TOML formatter (config.dist.toml, pyproject.toml, ruff.toml, ...).
  # Style rules are configured in .taplo.toml. Syntax validation is already
  # covered by check-toml above, so only the formatter is enabled here (the
  # taplo linter's real value is schemastore validation, which needs network
  # access and adds little for this project's small, schema-less TOML files).
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: local
    hooks:
      # Ruff linter (with safe autofixes).
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Ruff formatter.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      # ty static type checker. Runs on the whole project (configured via
      # [tool.ty] in pyproject.toml) rather than only the passed files, since
      # type checking is inherently whole-program.
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
