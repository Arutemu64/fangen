# ОСНОВНЫЕ НАСТРОЙКИ
event_name = "fanfan2025summer" # ID события (субдомен фестиваля)
api_key = "email@fancom.info"   # Ключ API
api_secret = "passw0rd"         # Секрет API
db_path = "./database.db"       # Путь к базе данных

# НАСТРОЙКИ ЗАПОЛНЕНИЯ EXCEL-ФАЙЛОВ
max_cell_length = 50

# НАСТРОЙКИ ЗАГРУЗЧИКА И СОРТИРОВЩИКА ФАЙЛОВ
dry_run = false
skip_fields = ["Видео или аудио репетиции", "Световой сценарий"]

allowed_exts = [
    "avi",
    "mp4",
    "mov",
    "wmv",
    "mkv",
    "mp3",
    "wav",
    "flac",
    "ogg",
    "m4a",
    "aac",
]

# Настройки имен файлов
max_title_length = 80
# Подстановки {...} заменяются данными заявки. К значению можно применить
# замену по регулярному выражению: {Поле:s/шаблон/замена/флаги} (см. README).
filename_template = "{n} [{Начало выступления}] {title} №{card} {value_title}"

# Режим сцены
stage_mode = true
